[package]
name = "locon"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Locon localization in Rust: flat locale files, lookup by key or phrase, CLDR plurals, the asset audit, and RealNative integration."
repository = "https://github.com/loconapp/locon-rs"
homepage = "https://locon.dev"
publish = false

[lib]
name = "locon"

[dependencies]
icu_plurals = "2.4"
icu_locale_core = "2.4"
fixed_decimal = "0.7.3"
include_dir = "0.7.4"
serde = "1"
serde_json = "1"
